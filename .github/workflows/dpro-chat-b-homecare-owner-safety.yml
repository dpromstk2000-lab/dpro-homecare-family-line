name: DPRO CHAT B Homecare Owner Safety Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-homecare-family-line" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/dpro-homecare-family-line, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch owner-readable terminology and help entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('owner.html'); s=p.read_text(encoding='utf-8'); before=s
          s=s.replace('本番環境では管理コードだけに依存せず、事業所の認証方式へ切り替えます。','管理コードは事業所ごとに安全に管理してください。')
          s=s.replace('<a href="system-check.html?demo=1" id="systemCheckLink">system-check</a>','<a href="system-check.html?demo=1" id="systemCheckLink">営業前チェック</a>')
          if 'data-dpro-chat-b-guide' not in s:
              guide='guide-center.html' if Path('guide-center.html').exists() else 'demo-guide.html'
              if not Path(guide).exists(): raise SystemExit('Guide Center/demo guide missing')
              style="""<style id="dpro-chat-b-guide-style">.dpro-chat-b-guide-link{position:fixed;right:12px;bottom:12px;z-index:9999;display:inline-flex;align-items:center;min-height:42px;padding:8px 13px;border:1px solid #cbdad6;border-radius:999px;background:#fff;color:#0b5c54;text-decoration:none;font-weight:850;box-shadow:0 8px 24px rgba(0,0,0,.12)}@media(max-width:700px){.dpro-chat-b-guide-link{bottom:72px}}</style>\n"""
              link=f"""<a class="dpro-chat-b-guide-link" data-dpro-chat-b-guide href="{guide}" target="_blank" rel="noopener">操作ガイド</a>\n"""
              s=s.replace('</head>',style+'</head>',1).replace('</body>',link+'</body>',1)
          if '>system-check<' in s: raise SystemExit('ordinary owner system-check label remains')
          for token in ['営業前チェック','data-dpro-chat-b-guide','管理コードは事業所ごとに安全に管理してください。']:
              if token not in s: raise SystemExit(f'expected owner fix missing: {token}')
          if s!=before: p.write_text(s,encoding='utf-8')
          print('HOMECARE owner safety patch: PASS')
          PY

      - name: Static owner QA
        shell: bash
        run: |
          ! grep -q '>system-check<' owner.html
          grep -q '>営業前チェック<' owner.html
          grep -q 'data-dpro-chat-b-guide' owner.html
          echo 'HOMECARE CHAT B static QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-homecare-owner-safety.yml"
          git add "owner.html"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix CHAT B homecare owner terminology and guide discoverability"
          git push
