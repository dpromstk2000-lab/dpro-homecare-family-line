name: STEP HOMECARE-16 Export Delivery Package

on:
  push:
    paths:
      - ".github/workflows/step-homecare-16-export-delivery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homecare-16-export-delivery
  cancel-in-progress: false

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate HOMECARE-15 source
        shell: bash
        run: |
          set -euo pipefail
          required=(
            app.js config.js family.html index.html member.html
            owner-ipad.css owner-ipad.html owner-ipad.js
            owner.css owner.html owner.js
            records.css records.html records.js
            schedule.css schedule.html schedule.js
            settings.css settings.html settings.js
            staff.css staff.html staff.js
            styles.css system-check.css system-check.html system-check.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "MISSING: $file"; exit 1; }
          done
          grep -F "HOMECARE-15-FINAL-REGRESSION-COMPLETE-20260728" config.js >/dev/null
          for file in ./*.js; do node --check "$file"; done
          echo "HOMECARE-15 source validation: PASS"

      - name: Create GitHub delivery ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery
          mkdir -p delivery/DPRO_HOMECARE_GITHUB_HOMECARE-15
          required=(
            app.js config.js family.html index.html member.html
            owner-ipad.css owner-ipad.html owner-ipad.js
            owner.css owner.html owner.js
            records.css records.html records.js
            schedule.css schedule.html schedule.js
            settings.css settings.html settings.js
            staff.css staff.html staff.js
            styles.css system-check.css system-check.html system-check.js
          )
          cp "${required[@]}" delivery/DPRO_HOMECARE_GITHUB_HOMECARE-15/
          test -f .nojekyll && cp .nojekyll delivery/DPRO_HOMECARE_GITHUB_HOMECARE-15/ || true
          (
            cd delivery/DPRO_HOMECARE_GITHUB_HOMECARE-15
            sha256sum * > ../DPRO_HOMECARE_GITHUB_SHA256.txt
          )
          (
            cd delivery
            zip -r -9 DPRO_HOMECARE_GITHUB_HOMECARE-15.zip DPRO_HOMECARE_GITHUB_HOMECARE-15 >/dev/null
          )
          unzip -t delivery/DPRO_HOMECARE_GITHUB_HOMECARE-15.zip

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_HOMECARE_GITHUB_HOMECARE-15
          path: |
            delivery/DPRO_HOMECARE_GITHUB_HOMECARE-15.zip
            delivery/DPRO_HOMECARE_GITHUB_SHA256.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/step-homecare-16-export-delivery.yml
          if git diff --cached --quiet; then
            echo "No workflow deletion to commit."
            exit 0
          fi
          git commit -m "Complete STEP HOMECARE-16 export delivery package"
          git push origin main
