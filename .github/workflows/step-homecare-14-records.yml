name: STEP HOMECARE-14 Record Search Export

on:
  push:
    paths:
      - ".github/workflows/step-homecare-14-records.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homecare-14-records
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create record archive screen
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import base64

          files = {'records.html': '', 'records.css': '', 'records.js': ''}
          for name, payload in files.items():
              text = base64.b64decode(payload).decode('utf-8')
              path = Path(name)
              if path.exists() and 'STEP HOMECARE-14' not in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'ERROR: {name} already exists without HOMECARE-14 marker')
              path.write_text(text, encoding='utf-8')
              print('WROTE', name)

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print('SKIP already updated', path_name)
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: expected one anchor in {path_name}, found {count}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('UPDATED', path_name)

          replace_once(
              'owner.html',
              '<a href="schedule.html?demo=1">訪問予定・定期予定</a>',
              '<a href="schedule.html?demo=1">訪問予定・定期予定</a>\n        <a href="records.html?demo=1">訪問記録の検索・出力</a>'
          )
          replace_once(
              'config.js',
              '// STEP HOMECARE-13: LINE本人確認・管理セッション・CORS強化',
              '// STEP HOMECARE-14: 訪問記録検索・CSV出力・印刷・保存運用'
          )
          replace_once(
              'config.js',
              "APP_VERSION: 'HOMECARE-13-SECURITY-HARDENING-COMPLETE-20260728'",
              "APP_VERSION: 'HOMECARE-14-RECORD-SEARCH-EXPORT-COMPLETE-20260728'"
          )
          replace_once(
              'system-check.js',
              "['予定管理','schedule.html?demo=1'],['スタッフ画面','staff.html?demo=1']",
              "['予定管理','schedule.html?demo=1'],['訪問記録検索','records.html?demo=1'],['スタッフ画面','staff.html?demo=1']"
          )
          replace_once(
              'system-check.js',
              "['予定管理',new URL('schedule.html?demo=1',base)],['スタッフ画面',new URL('staff.html?demo=1',base)]",
              "['予定管理',new URL('schedule.html?demo=1',base)],['訪問記録検索',new URL('records.html?demo=1',base)],['スタッフ画面',new URL('staff.html?demo=1',base)]"
          )
          PY

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check config.js
          node --check owner.js
          node --check records.js
          node --check system-check.js
          python <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          required = [
              'app.js','config.js','family.html','index.html','member.html',
              'owner-ipad.css','owner-ipad.html','owner-ipad.js','owner.css','owner.html','owner.js',
              'records.css','records.html','records.js',
              'schedule.css','schedule.html','schedule.js','settings.css','settings.html','settings.js',
              'staff.css','staff.html','staff.js','styles.css','system-check.css','system-check.html','system-check.js'
          ]
          missing=[p for p in required if not Path(p).exists()]
          if missing: raise SystemExit('Missing files: '+', '.join(missing))

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[];self.form_depth=0;self.nested=False;self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if tag=='form':
                      if self.form_depth:self.nested=True
                      self.form_depth+=1
                  if tag in ('script','link'):
                      key='src' if tag=='script' else 'href'
                      value=a.get(key,'')
                      if value and not value.startswith(('http:','https:','#','data:')):self.refs.append(value.split('?')[0])
              def handle_endtag(self,tag):
                  if tag=='form':self.form_depth=max(0,self.form_depth-1)

          for name in ['records.html','owner.html','system-check.html']:
              p=Inspector();p.feed(Path(name).read_text(encoding='utf-8'))
              dup=sorted({x for x in p.ids if p.ids.count(x)>1})
              if dup:raise SystemExit(f'{name} duplicate ids: {dup}')
              if p.nested:raise SystemExit(f'{name} nested form')
              bad=[r for r in p.refs if not Path(r).exists()]
              if bad:raise SystemExit(f'{name} missing refs: {bad}')

          for name in ['styles.css','records.css','owner.css','system-check.css']:
              text=Path(name).read_text(encoding='utf-8')
              if text.count('{')!=text.count('}'):
                  raise SystemExit(f'{name} CSS braces mismatch')

          cfg=Path('config.js').read_text(encoding='utf-8')
          if 'HOMECARE-14-RECORD-SEARCH-EXPORT-COMPLETE-20260728' not in cfg:raise SystemExit('HOMECARE-14 version missing')
          owner=Path('owner.html').read_text(encoding='utf-8')
          if 'records.html?demo=1' not in owner:raise SystemExit('owner link missing')
          check=Path('system-check.js').read_text(encoding='utf-8')
          if '訪問記録検索' not in check:raise SystemExit('system-check page missing')
          PY
          git diff --check

      - name: Commit completed files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/step-homecare-14-records.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.html records.css records.js owner.html config.js system-check.js .github/workflows/step-homecare-14-records.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Complete STEP HOMECARE-14 record search export"
          git push origin main
