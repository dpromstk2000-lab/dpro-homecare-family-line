name: STEP HOMECARE-13 Security Hardening

on:
  push:
    paths:
      - ".github/workflows/step-homecare-13-security.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homecare-13-security
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply HOMECARE-13 frontend security patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_homecare13.py
          python /tmp/patch_homecare13.py

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app.js
            config.js
            owner.js
            owner-ipad.js
            schedule.js
            settings.js
            staff.js
            system-check.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: HTML and local reference check
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          html_files = sorted(Path('.').glob('*.html'))
          errors = []

          class Inspector(HTMLParser):
              def __init__(self, name):
                  super().__init__(convert_charrefs=True)
                  self.name = name
                  self.ids = set()
                  self.form_depth = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      if attrs['id'] in self.ids:
                          errors.append(f'{self.name}: duplicate id {attrs["id"]}')
                      self.ids.add(attrs['id'])
                  if tag == 'form':
                      if self.form_depth:
                          errors.append(f'{self.name}: nested form')
                      self.form_depth += 1
                  for key in ('src','href'):
                      value = attrs.get(key, '')
                      if not value or value.startswith(('#','http:','https:','tel:','mailto:','javascript:','data:')):
                          continue
                      path = value.split('?',1)[0].split('#',1)[0]
                      if path and not (Path('.') / path).exists():
                          errors.append(f'{self.name}: missing local reference {path}')
              def handle_endtag(self, tag):
                  if tag == 'form':
                      self.form_depth = max(0, self.form_depth - 1)

          for path in html_files:
              parser = Inspector(path.name)
              parser.feed(path.read_text(encoding='utf-8'))

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'HTML checks passed: {len(html_files)} files')
          PY

      - name: Security regression check
        shell: bash
        run: |
          set -euo pipefail
          grep -q "HOMECARE-13-SECURITY-HARDENING-COMPLETE-20260728" config.js
          grep -q "ADMIN_SESSION_STORAGE_KEY" config.js
          grep -q "X-Admin-Session" owner.js
          grep -q "X-Admin-Session" owner-ipad.js
          grep -q "X-Admin-Session" schedule.js
          grep -q "X-Admin-Session" settings.js
          grep -q "X-Admin-Session" system-check.js
          grep -Fq 'headers.Authorization = `Bearer ${state.identity.idToken}`' app.js
          ! grep -q "OWNER_ADMIN_STORAGE_KEY" config.js owner.js owner-ipad.js settings.js
          ! grep -q "dpro_homecare_owner_admin_code" config.js owner.js owner-ipad.js settings.js
          ! grep -q "X-Admin-Code" owner.js owner-ipad.js schedule.js settings.js system-check.js
          git diff --check

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/step-homecare-13-security.yml

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js config.js owner.js owner-ipad.js schedule.js settings.js system-check.js .github/workflows/step-homecare-13-security.yml
          git commit -m "Complete STEP HOMECARE-13 security hardening"
          git push origin main
