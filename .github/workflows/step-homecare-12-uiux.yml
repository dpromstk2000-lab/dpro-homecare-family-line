name: STEP HOMECARE-12 UI UX Brush-up

on:
  push:
    paths:
      - ".github/workflows/step-homecare-12-uiux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homecare-12-uiux
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply HOMECARE-12 UI UX improvements
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          MARKER = "STEP HOMECARE-12: UI/UX横断ブラッシュアップ"

          def require(path, anchors):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"ERROR: required file not found: {path}")
              text = p.read_text(encoding="utf-8")
              for anchor in anchors:
                  if anchor not in text:
                      raise SystemExit(f"ERROR: anchor not found in {path}: {anchor}")
              return p, text

          def append_once(path, anchors, block):
              p, text = require(path, anchors)
              if MARKER in text:
                  print(f"SKIP: {path} already contains HOMECARE-12")
                  return
              p.write_text(text.rstrip() + "\n\n" + block.strip() + "\n", encoding="utf-8")
              print(f"UPDATED: {path}")

          def replace_once(path, old, new):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"ERROR: required file not found: {path}")
              text = p.read_text(encoding="utf-8")
              if new in text:
                  print(f"SKIP: {path} replacement already applied")
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"ERROR: expected exactly one match in {path}: {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"UPDATED: {path}")

          append_once(
              "styles.css",
              [":root {", ".button-small", "@media (max-width: 520px)"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          :root { --tap: 50px; }
          .button-small,
          .tab-button {
            min-height: 48px;
            font-size: 16px;
          }
          .status-pill {
            min-height: 30px;
            font-size: 14px;
          }
          .quick-action strong { font-size: 17px; }
          .quick-action span,
          .help,
          .list-meta,
          .profile-meta { font-size: 14px; }
          @media (max-width: 520px) {
            body { font-size: 17px; }
            .brand-title { font-size: 17px; }
            .button-row > .button { min-height: 52px; }
          }
          '''
          )

          append_once(
              "owner.css",
              [".owner-body", ".nav-button", ".button-small"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          .owner-body { font-size: 17px; }
          .nav-button {
            min-height: 48px;
            font-size: 16px;
            align-items: center;
          }
          .button-small,
          .owner-header-actions .button {
            min-height: 48px;
            font-size: 16px;
          }
          .status-pill,
          .importance-pill {
            min-height: 30px;
            align-items: center;
            font-size: 14px;
          }
          .owner-help,
          .sidebar-office span,
          .summary-card span { font-size: 15px; }
          @media (max-width: 620px) {
            .owner-body { font-size: 17px; }
            .owner-header-actions .button { min-width: 84px; }
          }
          '''
          )

          append_once(
              "owner-ipad.css",
              ["body{margin:0", ".tab-button", "@media(max-width:720px)"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          .status-pill,
          .importance-pill {
            min-height: 36px;
            font-size: 14px;
          }
          .tab-button { font-size: 16px; }
          .task-main p,
          .visit-main p,
          .help { font-size: 15px; }
          @media(max-width:720px) {
            body { font-size: 17px; }
            .button { min-height: 50px; }
          }
          '''
          )

          append_once(
              "schedule.css",
              [".schedule-shell", ".small-action", "@media (max-width: 560px)"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          .small-action,
          .button.compact {
            min-height: 48px;
            font-size: 16px;
          }
          .status-pill,
          .staff-chip,
          .visit-time small { font-size: 14px; }
          .form-help,
          .recurring-meta { font-size: 15px; }
          @media (max-width: 560px) {
            .schedule-shell { padding-bottom: 60px; }
            .panel-actions { display: grid; grid-template-columns: 1fr; }
            .panel-actions .button { width: 100%; min-height: 52px; }
          }
          '''
          )

          append_once(
              "staff.css",
              [":root {", ".result-buttons span", "@media (max-width: 700px)"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          :root {
            --ink: var(--text, #172422);
            --line: var(--border, #d7e0de);
            --shadow-soft: var(--shadow, 0 10px 28px rgba(20, 55, 50, 0.09));
          }
          .staff-eyebrow,
          .count-badge,
          .required-badge,
          .status-pill,
          .handover-flag { font-size: 14px; }
          .status-pill {
            min-height: 30px;
            display: inline-flex;
            align-items: center;
          }
          .form-help,
          .office-contact span,
          .date-control label span,
          .staff-summary span,
          .visit-meta,
          .client-alert strong,
          .staff-chip,
          .required-text,
          .plan-item-instruction { font-size: 15px; }
          .result-buttons span {
            min-height: 48px;
            font-size: 15px;
            padding: 7px;
          }
          .action-large {
            min-height: 56px;
            font-size: 17px;
          }
          @media (max-width: 700px) {
            body { font-size: 17px; }
            .record-actions .button { min-height: 56px; }
          }
          '''
          )

          append_once(
              "settings.css",
              [".settings-body", ".line-summary-grid", "@media(max-width:620px)"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          .settings-body { font-size: 17px; }
          .tab-button,
          .login-form input,
          .settings-form input,
          .settings-form select,
          .settings-form textarea { min-height: 50px; }
          .required,
          .version-badge,
          .status-pill { font-size: 14px; }
          .switch-row small { font-size: 15px; }
          @media(max-width:620px) {
            .settings-body { font-size: 17px; }
            .line-summary-grid { grid-template-columns: 1fr 1fr; }
            .line-summary-grid article:last-child { grid-column: 1 / -1; }
            .sticky-actions .save-button { min-height: 54px; }
          }
          '''
          )

          append_once(
              "system-check.css",
              [".check-body", ".check-row", "@media(max-width:620px)"],
              r'''
          /* STEP HOMECARE-12: UI/UX横断ブラッシュアップ */
          .check-body { font-size: 17px; }
          .eyebrow { font-size: 14px; }
          .check-row,
          .page-row { min-height: 48px; }
          .check-row span:last-child,
          .url-item code { font-size: 14px; }
          .control-card .button { min-height: 48px; }
          @media(max-width:620px) {
            .check-body { font-size: 17px; }
            .control-actions .button { min-height: 52px; }
          }
          '''
          )

          replace_once(
              "owner.html",
              "<strong>訪問介護 管理センター</strong>",
              "<strong>オーナー・管理者PC</strong>"
          )
          replace_once(
              "owner.html",
              "<h1>事業所の状況を、ひとつの画面で確認</h1>",
              "<h1>事業所全体を、ひとつの画面で管理</h1>"
          )
          replace_once(
              "owner.html",
              '<a href="owner-ipad.html?demo=1">サービス提供責任者・iPad</a>',
              '<a href="owner-ipad.html?demo=1">サービス提供責任者・当日業務</a>'
          )
          replace_once(
              "owner-ipad.html",
              "<strong>サービス提供責任者</strong>",
              "<strong>サービス提供責任者・当日業務</strong>"
          )

          config = Path("config.js")
          config_text = config.read_text(encoding="utf-8")
          old_version = "HOMECARE-8-SETTINGS-LINE-SYSTEMCHECK-COMPLETE-20260720"
          new_version = "HOMECARE-12-UIUX-BRUSHUP-COMPLETE-20260727"
          if new_version not in config_text:
              if config_text.count(old_version) != 1:
                  raise SystemExit("ERROR: config.js version anchor is missing or duplicated")
              config_text = config_text.replace(old_version, new_version, 1)
              config_text = config_text.replace(
                  "// STEP HOMECARE-8: 事業所設定・LINE連携承認・営業前system-check",
                  "// STEP HOMECARE-12: 全画面UI/UX横断ブラッシュアップ",
                  1
              )
              config.write_text(config_text, encoding="utf-8")
              print("UPDATED: config.js")
          else:
              print("SKIP: config.js already updated")
          PY

      - name: Validate JavaScript HTML CSS and file structure
        shell: bash
        run: |
          set -euo pipefail

          for file in *.js; do
            node --check "$file"
          done

          python <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          required = [
              "app.js", "config.js", "family.html", "index.html", "member.html",
              "owner-ipad.css", "owner-ipad.html", "owner-ipad.js",
              "owner.css", "owner.html", "owner.js",
              "schedule.css", "schedule.html", "schedule.js",
              "settings.css", "settings.html", "settings.js",
              "staff.css", "staff.html", "staff.js",
              "styles.css", "system-check.css", "system-check.html", "system-check.js"
          ]

          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"ERROR: required files missing: {missing}")

          class Checker(HTMLParser):
              def __init__(self, filename):
                  super().__init__(convert_charrefs=True)
                  self.filename = filename
                  self.ids = set()
                  self.duplicates = []
                  self.form_depth = 0
                  self.nested_forms = 0
                  self.local_refs = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  node_id = values.get("id")
                  if node_id:
                      if node_id in self.ids:
                          self.duplicates.append(node_id)
                      self.ids.add(node_id)

                  if tag == "form":
                      if self.form_depth:
                          self.nested_forms += 1
                      self.form_depth += 1

                  for attr in ("src", "href"):
                      value = values.get(attr, "")
                      if not value or value.startswith(("#", "http://", "https://", "tel:", "mailto:", "javascript:", "data:")):
                          continue
                      path = urlsplit(value).path
                      if path.endswith((".html", ".css", ".js")):
                          self.local_refs.append(path)

              def handle_endtag(self, tag):
                  if tag == "form" and self.form_depth:
                      self.form_depth -= 1

          errors = []
          for html_file in sorted(Path(".").glob("*.html")):
              checker = Checker(str(html_file))
              checker.feed(html_file.read_text(encoding="utf-8"))
              if checker.duplicates:
                  errors.append(f"{html_file}: duplicate ids {checker.duplicates}")
              if checker.nested_forms:
                  errors.append(f"{html_file}: nested forms {checker.nested_forms}")
              for ref in checker.local_refs:
                  if not Path(ref).is_file():
                      errors.append(f"{html_file}: missing local reference {ref}")

          for css_file in sorted(Path(".").glob("*.css")):
              text = css_file.read_text(encoding="utf-8")
              stripped = re.sub(r"/\*.*?\*/", "", text, flags=re.S)
              stripped = re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'', "", stripped)
              if stripped.count("{") != stripped.count("}"):
                  errors.append(
                      f"{css_file}: CSS brace mismatch "
                      f"{stripped.count('{')} != {stripped.count('}')}"
                  )

          staff_css = Path("staff.css").read_text(encoding="utf-8")
          for variable in ("--ink:", "--line:", "--shadow-soft:"):
              if variable not in staff_css:
                  errors.append(f"staff.css: required variable missing: {variable}")

          config = Path("config.js").read_text(encoding="utf-8")
          if "HOMECARE-12-UIUX-BRUSHUP-COMPLETE-20260727" not in config:
              errors.append("config.js: HOMECARE-12 version missing")

          if errors:
              raise SystemExit("VALIDATION FAILED\n" + "\n".join(errors))

          print(f"HTML checked: {len(list(Path('.').glob('*.html')))}")
          print(f"CSS checked: {len(list(Path('.').glob('*.css')))}")
          print(f"Required files: {len(required)}")
          print("HOMECARE-12 validation passed")
          PY

          git diff --check

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/step-homecare-12-uiux.yml

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Complete STEP HOMECARE-12 UI UX brush-up"
          git push origin main
